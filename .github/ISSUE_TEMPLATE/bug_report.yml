name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal steps using synthetic data only.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: XFlix, Node.js, MariaDB, browser, and operating system versions.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove credentials, private URLs, media paths, and personal data.
